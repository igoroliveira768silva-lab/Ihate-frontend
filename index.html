<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IHate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="cabeçalho">
        <h1 id="IHate-Title">IHate</h1>
        <button id="Hate-Zone" style="display: none;">Hate-Zone</button>
        <button id="favorito-bt">favoritos</button>

    </header>
    <div id="feed">

    </div>
    <div id="home-room">
        <div id="postagens_zone">
            <input id="mensage_text" placeholder="Diga qualquer coisa">
            <input id="foto-post" placeholder="URL de alguma imagem" type="url">
            <button id="postar">enviar</button>
        </div>
       
    </div>
    <div id="login-room" style="display: none;">
        <h2 id="title-login">Crie sua conta de Hater!!</h2><button id="x">x</button>
        <br>
        <input id="name" placeholder="name" type="text">
        <br>
        <input id="senha" placeholder="password" type="password">
        <br>
        <button id="create-conta">create</button>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
